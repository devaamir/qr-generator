<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App QR Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container { width: 100%; max-width: 560px; }

    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .header p { color: rgba(255,255,255,0.6); margin-top: 8px; font-size: 0.95rem; }

    .card {
      background: white;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .field { margin-bottom: 20px; }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-ios { background: #000; }
    .dot-android { background: #01875f; }

    input[type="url"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus { border-color: #0f3460; }
    input[type="url"]::placeholder { color: #bbb; }

    .btn-generate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      background: #fff0f0;
      color: #c0392b;
      border: 1px solid #fcc;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-top: 16px;
      display: none;
    }

    .result {
      display: none;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 2px dashed #e8e8e8;
      text-align: center;
    }

    .result h2 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 20px; font-weight: 700; }

    .qr-wrap {
      display: inline-block;
      padding: 16px;
      background: #f9f9fb;
      border-radius: 20px;
      border: 2px solid #e8e8e8;
      margin-bottom: 24px;
    }
    .qr-wrap img { display: block; border-radius: 8px; }

    .link-box {
      display: flex;
      align-items: center;
      background: #f5f5f7;
      border-radius: 12px;
      padding: 12px 14px;
      gap: 10px;
      margin-bottom: 16px;
    }
    .link-box span {
      flex: 1;
      font-size: 0.82rem;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .btn-copy {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #0f3460; }
    .btn-copy.copied { background: #01875f; }

    .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }

    .btn-action {
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-download { background: #f0f0f5; color: #1a1a2e; }
    .btn-download:hover { background: #e0e0ea; }
    .btn-new { background: #1a1a2e; color: white; }
    .btn-new:hover { background: #0f3460; }

    .note { font-size: 0.78rem; color: #aaa; line-height: 1.6; }
    .note strong { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>App QR Generator</h1>
      <p>One QR code that opens the right store for each device</p>
    </div>

    <div class="card">
      <div class="field">
        <label><span class="dot dot-ios"></span>App Store URL (iOS)</label>
        <input type="url" id="ios" placeholder="https://apps.apple.com/app/..." />
      </div>

      <div class="field">
        <label><span class="dot dot-android"></span>Play Store URL (Android)</label>
        <input type="url" id="android" placeholder="https://play.google.com/store/apps/details?id=..." />
      </div>

      <button class="btn-generate" id="generateBtn" onclick="generate()">Generate QR Code</button>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <h2>Your Smart QR Code is Ready</h2>
        <div class="qr-wrap">
          <img id="qrImg" src="" alt="QR Code" width="260" height="260" />
        </div>
        <div class="link-box">
          <span id="linkText"></span>
          <button class="btn-copy" id="copyBtn" onclick="copyLink()">Copy</button>
        </div>
        <div class="actions">
          <button class="btn-action btn-download" onclick="downloadQR()">Download QR</button>
          <button class="btn-action btn-new" onclick="resetForm()">New QR Code</button>
        </div>
        <p class="note">
          <strong>iOS</strong> → App Store &nbsp;·&nbsp; <strong>Android</strong> → Play Store<br>
          <strong>Desktop</strong> → shows both options
        </p>
      </div>
    </div>
  </div>

  <script>
    let currentQrDataUrl = '';
    let currentLink = '';

    async function generate() {
      const ios = document.getElementById('ios').value.trim();
      const android = document.getElementById('android').value.trim();
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('generateBtn');

      errorEl.style.display = 'none';

      if (!ios || !android) {
        showError('Please enter both App Store and Play Store URLs.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating...';

      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ios, android }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Something went wrong.');
          return;
        }

        currentQrDataUrl = data.qrDataUrl;
        currentLink = data.redirectUrl;

        document.getElementById('qrImg').src = data.qrDataUrl;
        document.getElementById('linkText').textContent = data.redirectUrl;
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      } catch {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate QR Code';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function copyLink() {
      navigator.clipboard.writeText(currentLink).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    }

    function downloadQR() {
      const a = document.createElement('a');
      a.href = currentQrDataUrl;
      a.download = 'app-qrcode.png';
      a.click();
    }

    function resetForm() {
      document.getElementById('ios').value = '';
      document.getElementById('android').value = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
